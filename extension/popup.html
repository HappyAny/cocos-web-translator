<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title data-i18n="name">Cocos翻译机</title></head><body>
<h1 data-i18n="name">Cocos翻译机</h1><p id="provider" data-i18n="connecting">连接扩展后台…</p>
<button id="pauseToggle" disabled data-i18n="pauseTranslation" aria-pressed="false">暂停翻译</button>
<section class="site"><h2 data-i18n="pageProfile">当前网页的 Profile</h2><p class="hint scope" id="pageScope"></p><select id="profileSelect" disabled data-i18n-label="pageProfile"></select><p class="hint" id="profileHint" data-i18n="profileBindingHint">记住当前网页的选择。</p><button id="createProfile" class="secondary" data-i18n="createProfile">新建 Profile</button></section>
<section class="site"><h2 data-i18n="pageTitle">当前网页</h2><p class="hint" data-i18n="pageHint">选择网页及嵌入内容的域名，只在授权网页启用 Cocos Web 翻译。</p><div id="origins"></div><button id="siteToggle" disabled data-i18n="enablePage">启用所选网页</button></section>
<label><span data-i18n="storyEnabled">剧情文字翻译</span><input type="checkbox" id="storyEnabled" data-i18n-label="storyEnabled"></label><label><span data-i18n="uiEnabled">界面文字翻译</span><input type="checkbox" id="uiEnabled" data-i18n-label="uiEnabled"></label>
<button id="settings" class="secondary" data-i18n="settingsTitle">Cocos翻译机 · 设置</button><button id="update" class="secondary" data-i18n="updateExtension">更新插件</button><p class="hint" id="status" data-i18n="syncHint">网页每三秒同步设置。</p><script type="module" src="popup.js"></script></body></html>
